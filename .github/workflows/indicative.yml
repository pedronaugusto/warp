name: Indicative x86 measurements
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Runner provenance
        shell: bash
        run: |
          git rev-parse HEAD
          zig version
          if [ "$RUNNER_OS" = "Linux" ]; then
            lscpu
            free -b
          else
            powershell.exe -NoProfile -Command 'Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors; Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory'
          fi
      - name: Paired interleaved rows (indicative)
        shell: bash
        run: |
          set -euo pipefail
          extension=""
          if [ "$RUNNER_OS" = "Windows" ]; then extension=".exe"; fi
          zig build hosted-single-build -Dtarget=x86_64-native -Dcpu=baseline -Dhosted-previous-main=true -Dhosted-single-previous=true -Dhosted-commit=e607c194f837fa0a7a8c08914495d4cc0202eb91
          cp "zig-out/bin/hosted-single$extension" "previous$extension"
          git fetch --depth=1 origin 491e62b865e27e296509fbc7bba1f392f224f565
          trap 'git restore --source=HEAD -- src' EXIT
          git restore --source=491e62b865e27e296509fbc7bba1f392f224f565 -- src
          zig build hosted-single-build -Dtarget=x86_64-native -Dcpu=baseline -Dhosted-commit=491e62b865e27e296509fbc7bba1f392f224f565
          cp "zig-out/bin/hosted-single$extension" "before$extension"
          git restore --source=HEAD -- src
          zig build hosted-single-build -Dtarget=x86_64-native -Dcpu=baseline -Dhosted-commit="$(git rev-parse HEAD)"
          cp "zig-out/bin/hosted-single$extension" "candidate$extension"
          for kind in text noise; do
            for operation in crc32 crc32c adler32 deflate-encode-L1 deflate-encode-L6 deflate-encode-L9 deflate-decode-std-L6-exact; do
              for sample in {0..20}; do
                order="0 1 2 3 4"
                if (( sample % 2 )); then order="4 3 2 1 0"; fi
                for stage in $order; do
                  executable="candidate"
                  if (( stage < 2 )); then executable="previous"; fi
                  if (( stage == 2 )); then executable="before"; fi
                  "./$executable$extension" "$kind" "$operation" "$sample" "$stage" | tee -a indicative.txt
                done
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indicative-${{ matrix.os }}
          path: indicative.txt
